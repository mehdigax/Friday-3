name: Build HAMRAH JARVIS APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify source ZIP
    run: |
      if [ ! -f friday-android-source.zip ]; then
        echo "ERROR: friday-android-source.zip not found!"
        exit 1
      fi

  - name: Extract Android source
    run: |
      mkdir -p src
      unzip -q friday-android-source.zip -d src
      echo "Source extracted successfully."
      find src -maxdepth 3 -name build.gradle -o -name build.gradle.kts

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.7"

  - name: Locate Android project
    id: project
    shell: bash
    run: |
      if [ -f src/gradlew ]; then
        echo "dir=src" >> "$GITHUB_OUTPUT"
      elif [ -f src/app/gradlew ]; then
        echo "dir=src/app" >> "$GITHUB_OUTPUT"
      else
        echo "ERROR: Gradle project wrapper not found."
        exit 1
      fi

  - name: Build debug APK
    working-directory: src
    run: |
      gradle assembleDebug --no-daemon --stacktrace

  - name: Find and prepare APK
    id: apk
    shell: bash
    run: |
      APK=$(find src -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

      if [ -z "$APK" ]; then
        echo "ERROR: No debug APK was generated."
        exit 1
      fi

      mkdir -p release
      cp "$APK" release/HAMRAH-JARVIS-debug.apk
      echo "APK_PATH=release/HAMRAH-JARVIS-debug.apk" >> "$GITHUB_OUTPUT"
      ls -lh release/HAMRAH-JARVIS-debug.apk

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: HAMRAH-JARVIS-APK
      path: release/HAMRAH-JARVIS-debug.apk
      if-no-files-found: error
      retention-days: 14
