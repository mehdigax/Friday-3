
name: Build Friday APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project already in repository root."
          else
            ZIP="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP" ]; then
              echo "ERROR: No ZIP file found in repository."
              find . -maxdepth 3 -type f
              exit 1
            fi

            echo "Extracting: $ZIP"
            mkdir -p /tmp/friday-source
            unzip -q "$ZIP" -d /tmp/friday-source

            SETTINGS="$(find /tmp/friday-source -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle(.kts) not found in ZIP."
              find /tmp/friday-source -maxdepth 4 -type f
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
            cp -a "$PROJECT_DIR"/. .
          fi

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found in project root."
            find . -maxdepth 3 -type f
            exit 1
          fi

          chmod +x gradlew

          if [ -f gradle.properties ]; then
            if ! grep -q '^kotlin.jvm.target.validation.mode=' gradle.properties; then
              echo 'kotlin.jvm.target.validation.mode=warning' >> gradle.properties
            fi
          else
            echo 'kotlin.jvm.target.validation.mode=warning' > gradle.properties
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Friday-debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
