- name: Find and extract Android source
  shell: bash
  run: |
    set -e
    ZIP="$(find . -maxdepth 4 -type f -iname '*.zip' | head -n 1)"

    if [ -z "$ZIP" ]; then
      echo "No ZIP file found in repository"
      find . -maxdepth 4 -type f
      exit 1
    fi

    echo "Using ZIP: $ZIP"
    mkdir -p /tmp/src
    unzip -q "$ZIP" -d /tmp/src

    F="$(find /tmp/src -type f \
      \( -name settings.gradle -o -name settings.gradle.kts \) \
      | head -n 1)"

    if [ -z "$F" ]; then
      echo "Gradle settings file not found"
      find /tmp/src -maxdepth 4 -type f
      exit 1
    fi

    cp -r "$(dirname "$F")"/. .
